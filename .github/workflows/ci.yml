name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# The workflow only reads the repository. Publishing lives in publish.yml, which is a
# separate file because nuget.org's trusted-publishing policy is keyed on the workflow
# *filename* -- so anything that can push to NuGet must be exactly one reviewable file.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The .debs, not the installed tree: apt's unpack-and-configure is only ~40s, while the
      # download was ~280s of a 366s step -- 150 MB out of azure.archive.ubuntu.com's universe
      # pocket at roughly 0.5 MB/s. Restoring the archives from the Actions cache removes that
      # download entirely; measured locally at 16s to fetch cold and 35s to install with the
      # network refused outright.
      #
      # Keyed on the package list, so adding a package fetches once and caches from then on.
      - name: Cache the TeX .debs
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-tex-${{ runner.os }}-${{ hashFiles('.github/tex-packages.txt') }}

      # Two of this suite's gates shell out, and both are written to report "not installed"
      # rather than to fail -- which is right on a contributor's laptop and wrong here.
      #
      #   pdflatex   compiles every golden .tex baseline. Without it, the single most
      #              valuable test in the milestone does not run.
      #   pdftoppm   rasterises a PDF for the ink gate, which exists because D33 once produced
      #              a perfectly valid document containing no visible markers while every other
      #              test passed. Since M2.5 it reads the Skia backend's own PDF as well as the
      #              one pdflatex produces.
      #
      # The package list and the reason for each entry live in .github/tex-packages.txt.
      - name: Install the TeX and raster toolchain
        run: |
          set -e
          pkgs=$(grep -vE '^[[:space:]]*(#|$)' .github/tex-packages.txt | tr '\n' ' ')
          mkdir -p "$HOME/apt-archives/partial"
          # apt drops privileges to _apt to fetch. If it cannot write the archive dir as that
          # user it downloads as root instead and says so; hand the dir over rather than let
          # the sandbox quietly turn itself off.
          sudo chown -R _apt:root "$HOME/apt-archives"
          sudo apt-get update
          # Download first, so a cache hit makes this a no-op and the install below never
          # touches the network. Split in two rather than one command because the download is
          # the part worth seeing separately in the log when this gets slow again.
          sudo apt-get install --no-install-recommends -y -d \
            -o Dir::Cache::archives="$HOME/apt-archives" $pkgs
          sudo apt-get install --no-install-recommends -y \
            -o Dir::Cache::archives="$HOME/apt-archives" $pkgs
          # actions/cache runs as the runner user and cannot read root-owned archives.
          sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-archives"
          echo "cache holds $(ls "$HOME/apt-archives"/*.deb 2>/dev/null | wc -l) .debs"

      # A gate that cannot run must not pass quietly. The test helpers deliberately degrade to
      # "unavailable" when a tool is missing, so CI asserts presence itself -- otherwise a
      # broken apt step would turn the TeX and ink gates off and the build would stay green.
      #
      # Presence of the binaries is not enough: --no-install-recommends can leave pdflatex
      # installed but a class or package it needs absent, which surfaces as a golden-test
      # failure minutes later instead of here. So compile the same prologue the backend emits
      # and rasterise it -- the whole toolchain, in about five seconds.
      - name: Assert the gates can actually run
        run: |
          set -e
          for tool in pdflatex pdftoppm; do
            command -v "$tool" >/dev/null || { echo "::error::$tool missing; the gate that needs it would silently skip"; exit 1; }
            echo "$tool -> $(command -v "$tool")"
          done
          cd "$(mktemp -d)"
          cat > smoke.tex <<'TEX'
          \documentclass[border=2bp]{standalone}
          \usepackage{tikz}
          \usepackage{textcomp}
          \usepackage{siunitx}
          \begin{document}
          \begin{tikzpicture}
            \draw (0,0) rectangle (1,1);
            \node at (0.5,0.5) {\qty{}{\metre\per\second\squared}};
          \end{tikzpicture}
          \end{document}
          TEX
          pdflatex -interaction=nonstopmode -halt-on-error smoke.tex > smoke.log 2>&1 || {
            echo "::error::the TeX toolchain is incomplete; the emitted prologue does not compile"
            grep -E '^(!|l\.[0-9])' smoke.log | head -20
            exit 1
          }
          pdftoppm -png -r 50 smoke.pdf smoke
          test -s smoke-1.png || { echo "::error::pdftoppm produced no raster"; exit 1; }
          echo "standalone, tikz, textcomp, siunitx and pdftoppm all work"

      - name: Restore
        run: dotnet restore Marey.slnx

      # TreatWarningsAsErrors is on in Directory.Build.props, so this is also the FS0064 gate:
      # a measure over-constraint (design.md 12.1) fails the build rather than printing a
      # warning nobody reads.
      - name: Build
        run: dotnet build Marey.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Marey.slnx --configuration Release --no-build --logger "console;verbosity=normal"

      # Packaging is part of what CI protects. It has broken on its own before -- a package
      # reference with only prereleases raised NU5104, which TreatWarningsAsErrors turned into
      # a pack failure that a build-and-test workflow would never have seen.
      - name: Pack
        run: dotnet pack Marey.slnx --configuration Release --no-build -o artifacts -p:Version=0.0.0-ci

      # The readme filename is deliberately not pinned. Directory.Build.targets packs a project's
      # own PackageReadme.md when it has one and falls back to NUGET.md when it does not, so a
      # hardcoded name goes stale the moment a project gains or loses its readme -- which is
      # exactly how this check broke once. The invariant worth asserting is the one that failed:
      # the nuspec must declare a readme, and the package must contain the file it declares.
      - name: Check every package carries its metadata
        run: |
          set -e
          count=$(ls artifacts/*.nupkg | wc -l)
          [ "$count" -eq 7 ] || { echo "::error::expected 7 packages, packed $count"; exit 1; }
          for pkg in artifacts/*.nupkg; do
            unzip -p "$pkg" '*.nuspec' > /tmp/nuspec.xml
            readme=$(grep -o '<readme>[^<]*</readme>' /tmp/nuspec.xml | sed 's:<readme>::;s:</readme>::')
            [ -n "$readme" ] || { echo "::error::$pkg declares no readme"; exit 1; }
            grep -q '<license type="expression">MIT</license>' /tmp/nuspec.xml || { echo "::error::$pkg has no license"; exit 1; }
            unzip -l "$pkg" | grep -q "$readme" || { echo "::error::$pkg declares $readme but does not contain it"; exit 1; }
            echo "  $(basename "$pkg"): $readme"
          done
          echo "7 packages, each with an MIT expression and the readme it declares"

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg
          retention-days: 7
