name: CI

on:
  push:
    branches: [main]
    # A release tag also publishes the documentation site (the `pages` job).
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# The workflow only reads the repository. Publishing lives in publish.yml, which is a
# separate file because nuget.org's trusted-publishing policy is keyed on the workflow
# *filename* -- so anything that can push to NuGet must be exactly one reviewable file.
permissions:
  contents: read

# A pull request's run is cancelled by the next push to it: only the newest commit's result is
# read. Every other run has a group of its own, so each push to main and each tag is checked to
# the end -- a group shared by them would keep one pending run and cancel the one before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # D146 — two SDK legs. `10.0.1xx` is the band the repository is developed and released with,
  # and the oldest a .NET 10 consumer can have; `10.0.x` is the newest, so a change in a newer
  # band shows up here as a red leg rather than in a consumer's restore. Each leg pins global.json
  # to exactly the SDK it installed: the runner image carries SDKs of its own, and `latestFeature`
  # would otherwise pick the newest of them in both legs.
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        sdk: ['10.0.1xx', '10.0.x']

    name: build (${{ matrix.sdk }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        id: dotnet
        with:
          dotnet-version: ${{ matrix.sdk }}

      - name: Pin the SDK the leg installed
        run: |
          printf '{ "sdk": { "version": "%s", "rollForward": "disable" } }\n' '${{ steps.dotnet.outputs.dotnet-version }}' > global.json
          echo "SDK $(dotnet --version)"

      # The .debs, not the installed tree: apt's unpack-and-configure is only ~40s, while the
      # download was ~280s of a 366s step -- 150 MB out of azure.archive.ubuntu.com's universe
      # pocket at roughly 0.5 MB/s. Restoring the archives from the Actions cache removes that
      # download entirely; measured locally at 16s to fetch cold and 35s to install with the
      # network refused outright.
      #
      # Keyed on the runner's Ubuntu, the package list and the week. A cache is saved only under a
      # key that missed, so a key of the package list alone was saved once and then restored for
      # good, while the archive moved on: every run downloaded the newer .debs again. With the
      # week in it, the first run of a week starts from last week's archives, fetches what moved
      # and saves the result; a new package list or a new Ubuntu starts from the closest key left.
      - name: The runner's Ubuntu and the week, for the cache key
        id: week
        run: echo "key=$ImageOS-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache the TeX .debs
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-tex-${{ hashFiles('.github/tex-packages.txt') }}-${{ steps.week.outputs.key }}
          restore-keys: |
            apt-tex-${{ hashFiles('.github/tex-packages.txt') }}-
            apt-tex-

      # Several of this suite's gates shell out, and every one of them is written to report
      # "not installed" rather than to fail -- which is right on a contributor's laptop and
      # wrong here.
      #
      #   pdflatex   compiles every golden .tex baseline. Without it, the single most
      #              valuable test in the milestone does not run.
      #   pdftoppm   rasterises a PDF for the ink gate, which exists because D33 once produced
      #              a perfectly valid document containing no visible markers while every other
      #              test passed. Since M2.5 it reads the Skia backend's own PDF as well as the
      #              one pdflatex produces.
      #   ffmpeg     encodes a frame sequence (D75). Without it the whole of VideoTests'
      #   ffprobe    encoding half skips, and ffprobe is what reads the container back --
      #              which is the difference between gating a video and gating an exit code.
      #
      # The package list and the reason for each entry live in .github/tex-packages.txt.
      - name: Install the external toolchain
        run: |
          set -e
          pkgs=$(grep -vE '^[[:space:]]*(#|$)' .github/tex-packages.txt | tr '\n' ' ')
          mkdir -p "$HOME/apt-archives/partial"
          # apt drops privileges to _apt to fetch. If it cannot write the archive dir as that
          # user it downloads as root instead and says so; hand the dir over rather than let
          # the sandbox quietly turn itself off.
          sudo chown -R _apt:root "$HOME/apt-archives"
          sudo apt-get update
          # Download first, so a cache hit makes this a no-op and the install below never
          # touches the network. Split in two rather than one command because the download is
          # the part worth seeing separately in the log when this gets slow again.
          sudo apt-get install --no-install-recommends -y -d \
            -o Dir::Cache::archives="$HOME/apt-archives" $pkgs
          sudo apt-get install --no-install-recommends -y \
            -o Dir::Cache::archives="$HOME/apt-archives" $pkgs
          # The versions the archive has moved past, so a restored cache does not grow every week.
          sudo apt-get autoclean -o Dir::Cache::archives="$HOME/apt-archives"
          # actions/cache runs as the runner user and cannot read root-owned archives.
          sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-archives"
          echo "cache holds $(ls "$HOME/apt-archives"/*.deb 2>/dev/null | wc -l) .debs"

      # A gate that cannot run must not pass quietly. The test helpers deliberately degrade to
      # "unavailable" when a tool is missing, so CI asserts presence itself -- otherwise a
      # broken apt step would turn the TeX and ink gates off and the build would stay green.
      #
      # Presence of the binaries is not enough: --no-install-recommends can leave pdflatex
      # installed but a class or package it needs absent, which surfaces as a golden-test
      # failure minutes later instead of here. So compile the same prologue the backend emits
      # and rasterise it -- the whole toolchain, in about five seconds.
      - name: Assert the gates can actually run
        run: |
          set -e
          for tool in pdflatex pdftoppm ffmpeg ffprobe latex dvisvgm; do
            command -v "$tool" >/dev/null || { echo "::error::$tool missing; the gate that needs it would silently skip"; exit 1; }
            echo "$tool -> $(command -v "$tool")"
          done
          cd "$(mktemp -d)"
          cat > smoke.tex <<'TEX'
          \documentclass[border=2bp]{standalone}
          \usepackage{tikz}
          \usepackage{textcomp}
          \usepackage{siunitx}
          \begin{document}
          \begin{tikzpicture}
            \draw (0,0) rectangle (1,1);
            \node at (0.5,0.5) {\qty{}{\metre\per\second\squared}};
          \end{tikzpicture}
          \end{document}
          TEX
          pdflatex -interaction=nonstopmode -halt-on-error smoke.tex > smoke.log 2>&1 || {
            echo "::error::the TeX toolchain is incomplete; the emitted prologue does not compile"
            grep -E '^(!|l\.[0-9])' smoke.log | head -20
            exit 1
          }
          pdftoppm -png -r 50 smoke.pdf smoke
          test -s smoke-1.png || { echo "::error::pdftoppm produced no raster"; exit 1; }
          echo "standalone, tikz, textcomp, siunitx and pdftoppm all work"

      - name: Restore
        run: dotnet restore Marey.slnx

      # TreatWarningsAsErrors is on in Directory.Build.props, so this is also the FS0064 gate:
      # a measure over-constraint (design.md 12.1) fails the build rather than printing a
      # warning nobody reads.
      #
      # On the band the public API listing is checked on, the build also writes each package's
      # signature for it (MareyApiSig, Directory.Build.targets), so the listing below reads this
      # build rather than compiling the solution a second time.
      - name: Build
        env:
          API_SIGNATURES: ${{ matrix.sdk == '10.0.1xx' && format('{0}/api-signatures', runner.temp) || '' }}
        run: |
          if [ -n "$API_SIGNATURES" ]; then
            mkdir -p "$API_SIGNATURES"
            dotnet build Marey.slnx --configuration Release --no-restore "-p:MareyApiSig=$API_SIGNATURES"
          else
            dotnet build Marey.slnx --configuration Release --no-restore
          fi

      # What ships names no internal decision: no decision number, design-document section,
      # milestone, phase or gate in the sources, the project files, the package readmes or the
      # XML documentation the build just wrote. The history is in the notes and the commits.
      - name: No internal references in what ships
        run: dotnet fsi tools/refs/check.fsx

      # Every public type and module has a doc comment, so the API reference has no blank entry.
      # Read from the Release assemblies' metadata and the XML documentation they just wrote.
      - name: Every public type and module is documented
        run: dotnet fsi tools/api/undocumented.fsx

      # MAREY_REQUIRE_TOOLCHAIN turns "the tool is not installed, so the gate did not run" from
      # a printed skip into a failure. Right here and wrong on a contributor's laptop: the steps
      # above install the toolchain on purpose, so a gate that skips on this runner means the
      # install silently stopped working, and every one of those gates degrades rather than
      # throwing -- a green run proving nothing.
      #
      # Not a duplicate of "Assert the gates can actually run" above, which asks a shell whether
      # six binaries are on PATH. This asks the test host, in process, through the same Lazy the
      # gates themselves read, and it covers the two things a shell cannot see: the SkiaSharp and
      # HarfBuzz natives, which are not on PATH and take out every raster, PDF, frame and ink
      # gate at once, and a PATH that differs between the shell and the runner. The census in
      # Verification.fs prints all nine dependencies either way; this decides whether an absent
      # one is fatal.
      #
      # On the band that builds the site, the guide's sessions also write each figure's scene for
      # it (MAREY_SITE_SCENES), so the Site step below does not run them a second time.
      - name: Test
        env:
          MAREY_REQUIRE_TOOLCHAIN: '1'
          MAREY_SITE_SCENES: ${{ matrix.sdk == '10.0.1xx' && format('{0}/site-scenes', runner.temp) || '' }}
        # Under a virtual display, for the GPU renderer's context (M5 phase 4); the census names
        # the driver it got, which here is llvmpipe. `--blame` because a native crash in a driver
        # aborts the test host with no failing test to read: with it, the log names the test that
        # was running.
        run: xvfb-run -a dotnet test Marey.slnx --configuration Release --no-build --blame --logger "console;verbosity=normal"

      # Packaging is part of what CI protects. It has broken on its own before -- a package
      # reference with only prereleases raised NU5104, which TreatWarningsAsErrors turned into
      # a pack failure that a build-and-test workflow would never have seen.
      - name: Pack
        run: dotnet pack Marey.slnx --configuration Release --no-build -o artifacts -p:Version=0.0.0-ci

      # The public API is what api/ says it is. The listing is the compiler's own signature of
      # each package with private and internal declarations and doc comments taken out
      # (tools/api/listing.fsx), so a rename, a changed parameter or a changed unit of measure
      # fails here until api/ is regenerated in the same change. Only on the band the repository
      # is built and released with: another compiler may print the same API differently. It reads
      # the signatures the Build step wrote, from a clean checkout, so every package was compiled
      # and wrote its own.
      - name: Public API listing
        if: matrix.sdk == '10.0.1xx'
        run: dotnet fsi tools/api/listing.fsx --check --signatures "$RUNNER_TEMP/api-signatures"

      # The readme filename is deliberately not pinned. Directory.Build.targets packs a project's
      # own PackageReadme.md when it has one and falls back to NUGET.md when it does not, so a
      # hardcoded name goes stale the moment a project gains or loses its readme -- which is
      # exactly how this check broke once. The invariant worth asserting is the one that failed:
      # the nuspec must declare a readme, and the package must contain the file it declares.
      #
      # The count is publish.yml's, and the two must move together; gate 15 in the test suite
      # fails if either differs from the number of packable projects in Marey.slnx. This one said 7 from M2 until
      # M3's close: publish.yml was raised at every phase that added a package and this file at
      # none, and nothing noticed because a failing example stopped every run at the Test step
      # first. The same drift .github/tex-packages.txt was created to end, in a different list.
      - name: Check every package carries its metadata
        run: |
          set -e
          count=$(ls artifacts/*.nupkg | wc -l)
          [ "$count" -eq 18 ] || { echo "::error::expected 18 packages, packed $count"; exit 1; }
          fable=0
          for pkg in artifacts/*.nupkg; do
            unzip -p "$pkg" '*.nuspec' > /tmp/nuspec.xml
            # M5 phase 2: a package that says Fable can consume it carries its sources for Fable.
            if grep -q '<tags>.*fable-library' /tmp/nuspec.xml; then
              id=$(grep -o '<id>[^<]*</id>' /tmp/nuspec.xml | sed 's:<id>::;s:</id>::')
              unzip -l "$pkg" | grep -q "fable/$id.fsproj" \
                || { echo "::error::$pkg is tagged fable-library and has no fable/$id.fsproj"; exit 1; }
              fable=$((fable + 1))
            fi
            readme=$(grep -o '<readme>[^<]*</readme>' /tmp/nuspec.xml | sed 's:<readme>::;s:</readme>::')
            [ -n "$readme" ] || { echo "::error::$pkg declares no readme"; exit 1; }
            grep -q '<license type="expression">MIT</license>' /tmp/nuspec.xml || { echo "::error::$pkg has no license"; exit 1; }
            # Marey's packages reach each other's internals, so each must depend on exactly the
            # version of the others it was built with (Directory.Build.targets pins it).
            if grep -o 'id="Marey\.[^"]*" version="[^"]*"' /tmp/nuspec.xml | grep -v 'version="\[[^],]*\]"'; then
              echo "::error::$pkg depends on a Marey package by a range, not an exact version"; exit 1
            fi
            unzip -l "$pkg" | grep -q "$readme" || { echo "::error::$pkg declares $readme but does not contain it"; exit 1; }
            echo "  $(basename "$pkg"): $readme"
          done
          [ "$fable" -eq 9 ] || { echo "::error::expected 9 packages with Fable sources, found $fable"; exit 1; }
          echo "18 packages, each with an MIT expression and the readme it declares; 9 with Fable sources"

      # D146, gate 1: the FSharp.Core a consumer needs is the one src/Directory.Build.props states,
      # not the one this leg's SDK bundles. 0.5.0 shipped `>= 10.1.401` because it was the latter.
      - name: Check every package states the pinned FSharp.Core
        run: |
          set -e
          want=$(sed -n 's:.*<MareyFSharpCore[^>]*>\([^<]*\)</MareyFSharpCore>.*:\1:p' src/Directory.Build.props)
          [ -n "$want" ] || { echo "::error::no MareyFSharpCore in src/Directory.Build.props"; exit 1; }
          for pkg in artifacts/*.nupkg; do
            unzip -p "$pkg" '*.nuspec' > /tmp/nuspec.xml
            got=$(grep -o 'id="FSharp.Core" version="[^"]*"' /tmp/nuspec.xml | sed 's:.*version="::;s:"::' | sort -u)
            [ "$got" = "$want" ] || { echo "::error::$pkg requires FSharp.Core $got, expected $want"; exit 1; }
          done
          echo "every package requires FSharp.Core >= $want"

      # Every package with code has its symbol package, and each PDB in it maps the sources to
      # the commit on GitHub. `Marey`, which carries no code, has none.
      - name: Check the symbol packages and their SourceLink
        run: |
          set -e
          count=$(ls artifacts/*.snupkg | wc -l)
          [ "$count" -eq 17 ] || { echo "::error::expected 17 symbol packages, packed $count"; exit 1; }
          for sym in artifacts/*.snupkg; do
            dir=$(mktemp -d)
            unzip -q "$sym" -d "$dir"
            for pdb in $(find "$dir" -name '*.pdb'); do
              strings -n 20 "$pdb" | grep -q 'raw.githubusercontent.com/Axym-Labs/marey/' \
                || { echo "::error::$sym: $(basename "$pdb") has no SourceLink to the repository"; exit 1; }
            done
          done
          echo "17 symbol packages, every PDB with SourceLink"

      - uses: actions/upload-artifact@v4
        if: matrix.sdk == '10.0.1xx'
        with:
          name: packages
          path: artifacts/*.nupkg
          retention-days: 7

      # The documentation site (tools/site/build.sh): the guide's pages around the scenes its
      # session draws, the gallery, and fsdocs' API reference. In this job because the guide
      # draws with the toolchain installed above. Built on every run, so a page that no longer
      # builds, or a readme link into the site that names no page of it, fails here; uploaded
      # for GitHub Pages from a release tag. The scenes are the ones the Test step's guide
      # sessions wrote.
      - name: Site
        if: matrix.sdk == '10.0.1xx'
        run: sh tools/site/build.sh site "$RUNNER_TEMP/site-scenes"

      - uses: actions/upload-pages-artifact@v3
        if: matrix.sdk == '10.0.1xx' && startsWith(github.ref, 'refs/tags/v')
        with:
          path: site

  pages:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # D130 — the Fable claim, as a job rather than a sentence. Fable compiles the projects that
  # claim it, with the scenes and figures behind the SVG baselines (`tests/Shared`), and Node
  # renders all of them; a document that differs by a byte fails, names itself, and is uploaded.
  # A Fable project that gains a .NET-only API fails earlier, at compile time, naming the API.
  fable:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        id: dotnet
        with:
          dotnet-version: '10.0.1xx'

      - name: Pin the SDK
        run: |
          printf '{ "sdk": { "version": "%s", "rollForward": "disable" } }\n' '${{ steps.dotnet.outputs.dotnet-version }}' > global.json
          echo "SDK $(dotnet --version)"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore Fable
        run: dotnet tool restore

      - name: Compile with Fable
        run: dotnet fable tests/Marey.Fable -o tests/Marey.Fable/out

      # And M5's gates 13 and 14 in the same run: the canvas backend's call log per golden scene,
      # against tests/Marey.Fable/canvas, and the fonts gate.
      - name: The SVG goldens, the canvas logs and the fonts under Node
        run: node tests/Marey.Fable/out/Main.js tests/Marey.Tests/golden tests/Marey.Fable/canvas

      # D121's consumer: the browser example compiles, so it cannot rot unseen. Serving it and
      # looking is a person's job; compiling it is this one's.
      - name: Compile the browser example
        run: dotnet fable examples/web -o examples/web/out

      # Step F, gate 7 (D157): the script a canvas page draws with is committed and embedded in
      # Marey.Html, so a change to what it is built from, without a rebuild, would ship a stale
      # script. Rebuild it and compare; Fable and esbuild are pinned, so the bytes must agree.
      - name: The page's script is the one its sources build
        run: |
          tools/view/build.sh
          git diff --exit-code -- src/Marey.Html/view/marey-view.js

      # M5 phase 2, gate 3: the same goldens built from the packages rather than the projects, so
      # Fable compiles the sources each package carries under fable/. A file the pack left out is
      # a compile error here, before anything is published.
      #
      # 1.0, G15: and through the `Marey` metapackage, which the test project references in place
      # of the packages themselves. So Fable follows a package with no code to the sources of what
      # it gathers, and passes over Tikz and Html, which it gathers too and which have none.
      - name: Pack the Fable projects and the metapackage
        run: |
          for p in Core Units Anim Plot Fields Interact Backend.Svg Backend.Web Sim Backend.Tikz Html; do
            dotnet pack src/Marey.$p --configuration Release -o fable-packages -p:Version=0.0.0-fable
          done
          dotnet pack src/Marey --configuration Release -o fable-packages -p:Version=0.0.0-fable

      - name: Compile with Fable from the packages
        env:
          MAREY_FROM_PACKAGES: 0.0.0-fable
          MAREY_PACKAGE_SOURCE: ${{ github.workspace }}/fable-packages
        run: |
          rm -rf tests/Marey.Fable/obj
          dotnet fable tests/Marey.Fable -o tests/Marey.Fable/out-packages

      - name: The SVG goldens, the canvas logs and the fonts under Node, from the packages
        run: node tests/Marey.Fable/out-packages/Main.js tests/Marey.Tests/golden tests/Marey.Fable/canvas

      - name: Upload the documents that differ
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fable-golden-actuals
          path: |
            tests/Marey.Tests/golden/*.actual.svg
            tests/Marey.Fable/canvas/*.actual.txt
          if-no-files-found: ignore

  # One script's PNGs on Linux and on Windows, compared pixel for pixel. The built-in themes draw
  # in the faces Marey.Backend.Skia carries, so nothing installed on either runner may move a
  # pixel; a difference here is a face resolved from the machine.
  png:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    name: png (${{ matrix.os }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        id: dotnet
        with:
          dotnet-version: '10.0.1xx'

      - name: Pin the SDK
        shell: bash
        run: |
          printf '{ "sdk": { "version": "%s", "rollForward": "disable" } }\n' '${{ steps.dotnet.outputs.dotnet-version }}' > global.json
          echo "SDK $(dotnet --version)"

      - name: Render
        run: dotnet run --project tools/png -c Release -- png-${{ matrix.os }}

      - uses: actions/upload-artifact@v4
        with:
          name: png-${{ matrix.os }}
          path: png-${{ matrix.os }}

  png-compare:
    needs: png
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.1xx'

      - uses: actions/download-artifact@v4

      - name: Linux and Windows, pixel for pixel
        run: dotnet fsi tools/png/compare.fsx png-ubuntu-latest png-windows-latest

  # A notebook whose only reference is `Marey`, run headless by Verso's released CLI over the
  # packages the build job packed: Verso restores the set the metapackage gathers, one cell uses
  # each of its packages, and the last cell's figure is drawn by `Marey.Verso`, loaded from its
  # package as an extension. A package missing from the set fails the cell that uses it; an
  # extension that no longer draws a figure leaves the last cell without one.
  verso:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.1xx'

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - name: Verso's CLI
        run: dotnet tool install Verso.Cli --version 1.2.3 --tool-path "$RUNNER_TEMP/verso"

      # The CLI targets net8.0, so the extension's net8.0 build is the one it loads.
      - name: The extension, from its package
        run: unzip -j artifacts/Marey.Verso.0.0.0-ci.nupkg 'lib/net8.0/Marey.Verso.dll' -d "$RUNNER_TEMP/extensions"

      - name: Run the notebook
        working-directory: tests/Verso
        run: |
          "$RUNNER_TEMP/verso/verso" run metapackage.dib --extensions "$RUNNER_TEMP/extensions" \
            --output json --output-file "$RUNNER_TEMP/verso.json" || echo "::error::verso run exited with $?"
          jq -e '(.cells | all(.status == "Success"))
                 and (.cells[-1].outputs | any(.mimeType == "text/html" and (.content | contains("<g id=\"figure\""))))' \
            "$RUNNER_TEMP/verso.json" >/dev/null \
            || { jq '.cells[] | {index, status, outputs: [.outputs[] | {mimeType, content: .content[:400]}]}' "$RUNNER_TEMP/verso.json"; exit 1; }
          echo "Marey restored the set in Verso, and Marey.Verso drew the figure"
